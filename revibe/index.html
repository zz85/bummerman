<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Bomberman</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body tabindex="0">
  <div id="ui">Bombs: <span id="bombs">3</span></div>
  <div id="controls">WASD/Arrows: Move | Space: Bomb | R: Reset</div>
  <script type="module" src="game.js"></script>
</body>
</html>
