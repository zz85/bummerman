<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>Bummerman FPS Mode</title>

	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
		canvas {
			width: 100%;
			height: 100%
		}
		#crosshair {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: white;
			font-size: 24px;
			pointer-events: none;
			text-shadow: 0 0 4px black;
		}
		#instructions {
			position: absolute;
			top: 10px;
			left: 10px;
			color: white;
			font-family: monospace;
			background: rgba(0,0,0,0.5);
			padding: 10px;
		}
	</style>
</head>

<body>
	<div id="crosshair">+</div>
	<div id="instructions">
		FPS Mode<br>
		WASD: Move | Arrow keys: Look | Space: Drop bomb<br>
		V: Toggle third person | Enter: Start/Restart
	</div>

	<!-- Common -->
	<script src="common.js"></script>
	<script src="common_3d.js"></script>

	<script>
	require('render3d_fps.js');
	require('bomber.js');
	</script>

</body>
</html>
