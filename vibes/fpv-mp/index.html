<!DOCTYPE html>
<html>
<head>
  <title>BUMMERMAN FPV - Multiplayer</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }
    
    #ui {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      display: flex;
      gap: 20px;
    }
    .stat {
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.3) 100%);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }
    .stat-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 24px; font-weight: bold; }
    .stat-bombs .stat-value { color: #ff6b35; }
    .stat-blast .stat-value { color: #f7c948; }
    .stat-ping .stat-value { color: #aaa; }
    .stat-enemies .stat-value { color: #e84855; }
    .stat-score .stat-value { color: #3dd6d0; }
    .stat-time .stat-value { color: #fff; }
    .stat-time.warning .stat-value { color: #f7c948; }
    .stat-time.danger .stat-value { color: #e84855; animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }
    
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    #crosshair::before { width: 20px; height: 2px; left: -10px; top: -1px; }
    #crosshair::after { width: 2px; height: 20px; left: -1px; top: -10px; }
    
    #minimap {
      position: fixed;
      top: 20px;
      right: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    #vignette {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
    }
    
    #damage-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(255,0,0,0.3) 100%);
      opacity: 0;
      transition: opacity 0.1s;
    }
    
    #danger-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      border: 3px solid transparent;
      opacity: 0;
      transition: opacity 0.15s;
    }
    #danger-overlay.active {
      border-color: rgba(255, 80, 80, 0.35);
      opacity: 1;
    }
    
    /* Lobby UI */
    #lobby {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lobby-content {
      text-align: center;
      color: white;
    }
    .lobby-content h1 {
      font-size: 72px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6b35, #f7c948);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .lobby-content .subtitle {
      font-size: 18px;
      color: #666;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .mode-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .mode-btn {
      padding: 20px 40px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .mode-btn:hover { transform: scale(1.05); }
    .mode-btn.host {
      background: linear-gradient(135deg, #ff6b35, #e84855);
      color: white;
    }
    .mode-btn.join {
      background: linear-gradient(135deg, #3dd6d0, #00aaff);
      color: white;
    }
    .peer-section {
      margin-top: 30px;
      display: none;
    }
    .peer-section.active { display: block; }
    .peer-id-display {
      font-size: 28px;
      font-family: monospace;
      background: #222;
      padding: 15px 30px;
      border-radius: 8px;
      margin: 15px 0;
      user-select: all;
      cursor: pointer;
    }
    .peer-input {
      padding: 15px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      width: 300px;
      text-align: center;
    }
    .connect-btn {
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #44ff66;
      color: #000;
      cursor: pointer;
      margin-left: 10px;
    }
    .status {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }
    .status.connected { color: #44ff66; }
    .status.error { color: #e84855; }
    .waiting-msg {
      color: #f7c948;
      font-size: 16px;
      margin-top: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Game screens */
    #game-over, #win-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
    }
    #game-over h1 { font-size: 80px; color: #e84855; }
    #win-screen h1 { font-size: 80px; color: #3dd6d0; }
    .final-score { font-size: 32px; margin: 20px 0; color: #888; }
    .restart-btn {
      margin-top: 30px;
      padding: 15px 40px;
      background: #333;
      border: none;
      color: white;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    .restart-btn:hover { background: #444; }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="damage-overlay"></div>
  <div id="danger-overlay"></div>
  
  <div id="ui" style="display:none;">
    <div class="stat stat-bombs">
      <div class="stat-label">Bombs</div>
      <div class="stat-value" id="bombs">3</div>
    </div>
    <div class="stat stat-blast">
      <div class="stat-label">Blast</div>
      <div class="stat-value" id="blast">3</div>
    </div>
    <div class="stat stat-ping">
      <div class="stat-label">Ping</div>
      <div class="stat-value" id="ping">-</div>
    </div>
    <div class="stat stat-score">
      <div class="stat-label">Kills</div>
      <div class="stat-value" id="kills">0</div>
    </div>
    <div class="stat stat-score">
      <div class="stat-label">Wins</div>
      <div class="stat-value" id="wins">0</div>
    </div>
    <div class="stat stat-time">
      <div class="stat-label">Time</div>
      <div class="stat-value" id="timer">3:00</div>
    </div>
  </div>
  
  <div id="crosshair"></div>
  <canvas id="minimap" width="150" height="150"></canvas>
  
  <div id="lobby">
    <div class="lobby-content">
      <h1>BUMMERMAN</h1>
      <div class="subtitle">Multiplayer</div>
      
      <div class="mode-buttons">
        <button class="mode-btn host" onclick="hostGame()">HOST GAME</button>
        <button class="mode-btn join" onclick="joinGame()">JOIN GAME</button>
      </div>
      
      <div id="host-section" class="peer-section">
        <div>Share this code with your friend:</div>
        <div class="peer-id-display" id="my-peer-id">connecting...</div>
        <div class="waiting-msg">Waiting for player to join...</div>
        <div class="status" id="host-status"></div>
      </div>
      
      <div id="join-section" class="peer-section">
        <div>Enter host's code:</div>
        <div style="margin-top:15px;">
          <input type="text" class="peer-input" id="peer-id-input" placeholder="Enter code">
          <button class="connect-btn" onclick="connectToPeer()">CONNECT</button>
        </div>
        <div class="status" id="join-status"></div>
      </div>
    </div>
  </div>
  
  <div id="game-over">
    <h1>WASTED</h1>
    <div class="final-score">Score: <span id="final-score-go">0</span></div>
    <button class="restart-btn" onclick="location.reload()">TRY AGAIN</button>
  </div>
  
  <div id="win-screen">
    <h1>VICTORY</h1>
    <div class="final-score">Score: <span id="final-score-win">0</span></div>
    <button class="restart-btn" onclick="location.reload()">PLAY AGAIN</button>
  </div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
